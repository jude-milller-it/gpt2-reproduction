pretrain:
  out_dir: out
  log_dir: log
  ckpt_path: null
  eval_interval: 250
  log_interval: 1
  val_loss_steps: 20
  save_freq: 5000
  init_from: scratch
  wandb_log: false
  wandb_project: fineweb
  wandb_run_name: gpt2
  total_batch_size: 524288
  batch_size: 32
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  bias: false
  learning_rate: 0.0006
  max_steps: 19073
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  min_lr: 0.00006   # 最小学习率（学习率衰减的下限）
  warmup_steps: 715
  lr_decay_steps: 19073
  backend: nccl
  dtype: bfloat16
  use_compile: false

sft:
  init_ckpt: model_30000.pt
  total_batch_size: 131072
  eval_interval: 10
  save_freq: 50
  max_steps: 240
  warmup_steps: 24
  lr_decay_steps: 240
  learning_rate: 0.00005
